name: Verify live website
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Real website and invite verification
        env:
          WEB_URL: https://aphysickui.github.io/DPoker/
        run: |
          python scripts/browser_test.py
          python scripts/browser_table_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-screenshots
          path: artifacts/*.png
