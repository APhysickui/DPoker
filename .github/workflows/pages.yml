name: Check and publish Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Worker integration tests
        run: |
          npx wrangler dev --port 8788 > /tmp/worker.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://localhost:8788/api/health && break || sleep 1; done
          npm run test:integration
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.VITE_API_URL != ''
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VITE_API_URL != ''
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
